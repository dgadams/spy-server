name: spy-server
services:
  spy-server:
    container_name: spy-server
    image: dgadams/spy-server:latest
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - 5555:5555

    healthcheck:
      test: echo -n | nc -w1 127.0.0.1 5555
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
